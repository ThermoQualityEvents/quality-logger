<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log New Quality Event</title>
    <style> body { font-family: Arial; margin: 20px; } form { max-width: 600px; } </style>
</head>
<body>
    <h1>Log New Quality Event</h1>
    <form method="POST">
        <label>Event Type*:</label><br>
        <input type="text" name="event_type" required placeholder="e.g., Non-conformance, Incident"><br><br>

        <label>Description*:</label><br>
        <textarea name="description" rows="5" required placeholder="Details of the event..."></textarea><br><br>

        <label>Severity:</label>
        <select name="severity">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
            <option value="Critical">Critical</option>
        </select><br><br>

        <label>Reporter:</label>
        <input type="text" name="reporter" placeholder="Your name or ID"><br><br>

        <label>Immediate Actions Taken:</label><br>
        <textarea name="actions" rows="3" placeholder="What was done right away?"></textarea><br><br>

        <label>Status:</label>
        <select name="status">
            <option value="Open">Open</option>
            <option value="In Progress">In Progress</option>
            <option value="Closed">Closed</option>
        </select><br><br>

        <button type="submit">Submit Event</button>
    </form>
    <br>
    <a href="{{ url_for('index') }}">Back to Log</a>
</body>
</html>
